name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  diagnosis-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python syntax
        run: python -m compileall -q kubemedic tests
      - name: Unit tests and labeled cases
        run: python -m unittest discover -s tests -v
      - name: Evaluate labeled synthetic fault coverage
        run: python -m kubemedic.evaluate --output synthetic-evaluation.json
      - name: Save evaluation report
        uses: actions/upload-artifact@v4
        with:
          name: kubemedic-synthetic-evaluation
          path: synthetic-evaluation.json
          retention-days: 14
      - name: Read-only diagnosis smoke
        run: python -m kubemedic.cli examples/faults/runtime.json --output runtime-report.json
